name: Daily workout notification

on:
  schedule:
    # 22:30 UTC = 05:30 Asia/Ho_Chi_Minh (GitHub may delay scheduled runs a few minutes)
    - cron: "30 22 * * *"
  workflow_dispatch:

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/send-daily-notification.mjs
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
